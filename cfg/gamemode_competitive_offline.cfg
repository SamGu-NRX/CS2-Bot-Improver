// If you're in offline mode, you want bots. We should provide those for you.
bot_quota											10
bot_quota_mode										fill

// SourceTV records every Bot Mode match as a demo (game/csgo/replays/auto-*.dem).
// Set before the bots join. SourceTV takes its own slot and is not counted when
// bots fill, so bot_quota stays 10 (you, 9 bots, SourceTV). Changing bot_quota
// in the middle of a map kicks SourceTV and ends the recording.
tv_enable											1
tv_autorecord										1
// gamemode_competitive.cfg sets 105. Nobody watches a local match live, and a
// delayed recording can lose the final rounds when the game closes right after.
tv_delay											0

exec my_bot_normal_config.cfg